<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{subject}</title>
    <link rel="stylesheet" href="../styles/email_common.css">
</head>
<body>
    <div class="email-container">
        <div class="email-header">Eliminado del Equipo</div>
        <div class="email-body">
            <p>Hola {recipient_name},</p>
            <p>Has sido eliminado del equipo <strong>{team_name}</strong> en Rockilus.</p>
            <p>Si crees que esto fue un error, por favor contacta al administrador de tu equipo.</p>
        </div>
        <div class="email-footer">
            <p>Si tienes alguna pregunta, no dudes en contactarnos.</p>
            <p>Gracias,<br>El Equipo de Rockilus</p>
        </div>
    </div>
</body>
</html>
