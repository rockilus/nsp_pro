<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{subject}</title>
    <link rel="stylesheet" href="../styles/email_common.css">
</head>
<body>
    <div class="email-container">
        <div class="email-header">Removed from Team</div>
        <div class="email-body">
            <p>Hi {recipient_name},</p>
            <p>You have been removed from the team <strong>{team_name}</strong> on Rockilus.</p>
            <p>If you believe this was a mistake, please contact your team administrator.</p>
        </div>
        <div class="email-footer">
            <p>If you have any questions, feel free to reach out to us.</p>
            <p>Thank you,<br>The Rockilus Team</p>
        </div>
    </div>
</body>
</html>
