<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{subject}</title>
    <link rel="stylesheet" href="../styles/email_common.css">
</head>
<body>
    <div class="email-container">
        <div class="email-header">Un Membre a Quitté l'Équipe</div>
        <div class="email-body">
            <p>Bonjour {recipient_name},</p>
            <p><strong>{user_name}</strong> a quitté l'équipe <strong>{team_name}</strong> sur Rockilus.</p>
            <p>Cliquez sur le bouton ci-dessous pour gérer votre équipe :</p>
            <a href="{notification_link}" class="cta-button">Voir l'Équipe</a>
        </div>
        <div class="email-footer">
            <p>Si vous avez des questions, n'hésitez pas à nous contacter.</p>
            <p>Merci,<br>L'Équipe Rockilus</p>
        </div>
    </div>
</body>
</html>
