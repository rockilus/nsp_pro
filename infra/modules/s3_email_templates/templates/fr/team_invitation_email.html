<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation à rejoindre une équipe</title>
    <!-- Styles inlined for email client compatibility -->
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:Arial, Helvetica, sans-serif;color:#333333;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-collapse:collapse;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-collapse:collapse;margin:0 auto;">
                    <tr>
                        <td style="padding:20px 20px 10px 20px;">
                            <a href="https://www.rockilus.com" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none;">
                                <img src="${logo_url}" alt="Rockilus" style="display:block;border:0;outline:none;text-decoration:none;width:140px;height:auto;" />
                            </a>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding:10px 20px 20px 20px;">
                            <h1 style="margin:0;font-size:24px;line-height:1.2;font-weight:700;color:#0b2b8a;text-align:center;">Vous êtes invité à rejoindre une équipe !</h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:0 40px 20px 40px;font-size:16px;line-height:1.5;color:#333333;">
                            <p style="margin:0 0 12px 0;">Bonjour {recipient_name},</p>
                            <p style="margin:0 0 18px 0;"><strong>{sender_name}</strong> vous a invité à rejoindre l'équipe <strong>{team_name}</strong> sur Rockilus.</p>
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding:0 20px 30px 20px;">
                            <a href="{invitation_link}" target="_blank" rel="noopener noreferrer" aria-label="Rejoindre l'équipe" style="background-color:#0b2b8a;color:#ffffff;text-decoration:none;padding:14px 24px;border-radius:6px;display:inline-block;font-weight:600;font-size:16px;">Rejoindre l'équipe</a>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:0 40px 20px 40px;font-size:16px;line-height:1.5;color:#333333;">
                            <p style="margin:0 0 12px 0;">Merci,</p>
                            <p style="margin:0 0 12px 0;">L'équipe Rockilus</p>
                            <p style="margin:0;font-size:14px;"><a href="https://www.rockilus.com" style="color:#0b2b8a;text-decoration:none;">https://www.rockilus.com</a></p>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:20px;text-align:center;font-size:12px;color:#999999;">
                            <p style="margin:0;">&copy; Rockilus</p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
