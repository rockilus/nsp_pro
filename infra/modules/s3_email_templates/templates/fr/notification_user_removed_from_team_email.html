<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{subject}</title>
    <link rel="stylesheet" href="../styles/email_common.css">
</head>
<body>
    <div class="email-container">
        <div class="email-header">Retiré de l'Équipe</div>
        <div class="email-body">
            <p>Bonjour {recipient_name},</p>
            <p>Vous avez été retiré de l'équipe <strong>{team_name}</strong> sur Rockilus.</p>
            <p>Si vous pensez qu'il s'agit d'une erreur, veuillez contacter l'administrateur de votre équipe.</p>
        </div>
        <div class="email-footer">
            <p>Si vous avez des questions, n'hésitez pas à nous contacter.</p>
            <p>Merci,<br>L'Équipe Rockilus</p>
        </div>
    </div>
</body>
</html>
