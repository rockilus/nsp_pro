[tool.poetry]
name = "nsp-pro"
version = "0.1.0"
description = ""
authors = ["FelipeKha <felipe.kharaba@icloud.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
flask = "^2.3.2"
mongo-types = "^0.15.1"
flask-jwt-extended = "^4.4.4"
flask-cors = "^3.0.10"
flask-bcrypt = "^1.0.1"
pandas = "^2.0.3"
pyhumps = "^3.8.0"
fastapi = "^0.103.2"
uvicorn = "^0.23.2"
pydantic = "^2.4.2"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
supertokens-python = "^0.18.7"
permit = "^2.3.0"
pymongo = {extras = ["aws"], version = "^4.6.2"}
boto3 = "^1.34.56"
loguru = "^0.7.2"
pytest = "^8.2.2"
ortools = "^9.10.4067"
numpy = "^2.1.1"
mongoengine = "^0.29.1"
spacy = "3.7.2"
pylint = "^3.3.1"
openpyxl = "^3.1.5"
pillow = "^11.0.0"

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
mypy = "^1.3.0"
flake8 = "^6.0.0"
