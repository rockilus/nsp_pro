[pytest]
env =
    # Environment
    ENVIRONMENT=development
    # API:
    API_DOMAIN=0.0.0.0
    API_URL=http://0.0.0.0:4000
    API_PORT=4000
    ORIGINS=["http://0.0.0.0:3000"]
    #CLIENT
    CLIENT_URL=http://0.0.0.0:3000
