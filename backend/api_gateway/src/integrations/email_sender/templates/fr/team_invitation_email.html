<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Invitation</title>
    <link rel="stylesheet" href="team_invitation_email.css">
</head>
<body>
    <div class="email-container">
        <div class="email-header">You're Invited to Join a Team!</div>
        <div class="email-body">
            <p>Hi {recipient_name},</p>
            <p><strong>{sender_name}</strong> has invited you to join the team <strong>{team_name}</strong> on Rockilus.</p>
            <p>Click the button below to accept the invitation and join the team:</p>
            <a href="{invitation_link}" class="cta-button">Join Team</a>
        </div>
        <div class="email-footer">
            <p>If you have any questions, feel free to reach out to us.</p>
            <p>Thank you,<br>The Rockilus Team</p>
        </div>
    </div>
</body>
</html>
