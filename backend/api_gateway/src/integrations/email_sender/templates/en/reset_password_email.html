<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <link rel="stylesheet" href="../styles/email_common.css">
</head>
<body>
    <div class="email-container">
        <div class="email-header">Reset Your Password</div>
        <div class="email-body">
            <p>Hi {recipient_name},</p>
            <p>We received a request to reset your password for your Rockilus account.</p>
            <p>Click the button below to reset your password:</p>
            <a href="{reset_password_link}" class="cta-button">Reset Password</a>
            <p>If you did not request a password reset, you can safely ignore this email.</p>
        </div>
        <div class="email-footer">
            <p>Thank you,<br>The Rockilus Team</p>
        </div>
    </div>
</body>
</html>
