[tool.poetry]
name = "api_gateway"
version = "0.1.0"
description = ""
authors = ["FelipeKha <felipe.kharaba@icloud.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<=3.13"
flask = "^2.3.2"
flask-jwt-extended = "^4.4.4"
flask-cors = "^3.0.10"
flask-bcrypt = "^1.0.1"
pandas = "^2.0.3"
pyhumps = "^3.8.0"
uvicorn = "^0.23.2"
pydantic = "^2.4.2"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
permit = "^2.3.0"
pymongo = {extras = ["aws"], version = "^4.6.2"}
boto3 = "^1.34.56"
pytest = "^8.2.2"
numpy = "^2.1.1"
spacy = "3.7.2"
pylint = "^3.3.1"
openpyxl = "^3.1.5"
pillow = "^11.0.0"
types-requests = "^2.32.0.20241016"
supertokens-python = "^0.25.1"
celery = "^5.4.0"
redis = "^5.2.0"
flake8 = "^7.1.1"
fastapi = "^0.115.6"
shared = {path = "../shared"}
black = "^25.1.0"
isort = "^6.0.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.3.0"
autoflake = "^2.2.1"
types-openpyxl = "^3.1.5.20241025"

[tool.black]
skip-string-normalization = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
