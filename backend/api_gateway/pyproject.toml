[project]
name = "api_gateway"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [ { name = "FelipeKha", email = "felipe.kharaba@icloud.com" } ]
requires-python = ">=3.13,<=3.14"
dependencies = [
	"pyhumps>=3.8.0,<4.0.0",
	"uvicorn>=0.23.2,<1.0.0",
	"pydantic>=2.4.2,<3.0.0",
	"python-multipart>=0.0.6,<1.0.0",
	"permit>=2.3.0,<3.0.0",
	"boto3>=1.34.56,<2.0.0",
	"numpy>=2.1.1,<3.0.0",
	"openpyxl>=3.1.5,<4.0.0",
	"fastapi>=0.115.6,<1.0.0",
	"pydantic-settings>=2.8.1,<3.0.0",
	"pyjwt[crypto]>=2.11.0,<3.0.0",
	"shared",
]

[dependency-groups]
dev = [
	"pytest>=8.2.2,<9.0.0",
	"mypy>=1.3.0,<2.0.0",
	"types-openpyxl>=3.1.5.20241025,<4.0.0",
	"pytest-asyncio>=1.0.0,<2.0.0",
	"boto3-stubs[s3,ssm]>=1.39.4,<2.0.0",
	"botocore-stubs>=1.38.46,<2.0.0",
	"pytest-env>=1.1.5,<2.0.0",
	"types-requests>=2.32.0.20241016,<3.0.0",
	"ruff>=0.15.8",
]

[tool.uv]
package = true

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"
# lint.select = ["E", "F", "I", "N", "UP", "PL"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
