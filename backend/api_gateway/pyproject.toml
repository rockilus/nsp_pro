[project]
name = "api_gateway"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [ { name = "FelipeKha", email = "felipe.kharaba@icloud.com" } ]
requires-python = ">=3.13,<=3.14"
dependencies = [
	"flask>=2.3.2,<3.0.0",
	"flask-jwt-extended>=4.4.4,<5.0.0",
	"flask-cors>=3.0.10,<4.0.0",
	"flask-bcrypt>=1.0.1,<2.0.0",
	"pandas>=2.0.3,<3.0.0",
	"pyhumps>=3.8.0,<4.0.0",
	"uvicorn>=0.23.2,<1.0.0",
	"pydantic>=2.4.2,<3.0.0",
	"python-multipart>=0.0.6,<1.0.0",
	"python-jose[cryptography]>=3.3.0,<4.0.0",
	"passlib[bcrypt]>=1.7.4,<2.0.0",
	"permit>=2.3.0,<3.0.0",
	"pymongo[aws]>=4.6.2,<5.0.0",
	"boto3>=1.34.56,<2.0.0",
	"numpy>=2.1.1,<3.0.0",
	"openpyxl>=3.1.5,<4.0.0",
	"Pillow>=11.0.0,<12.0.0",
	"fastapi>=0.115.6,<1.0.0",
	"pydantic-settings>=2.8.1,<3.0.0",
	"pyjwt[crypto]>=2.11.0,<3.0.0",
	"shared",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["api_gateway*"]

[dependency-groups]
dev = [
	"pytest>=8.2.2,<9.0.0",
	"mypy>=1.3.0,<2.0.0",
	"autoflake>=2.2.1,<3.0.0",
	"types-openpyxl>=3.1.5.20241025,<4.0.0",
	"pytest-asyncio>=1.0.0,<2.0.0",
	"boto3-stubs[s3,ssm]>=1.39.4,<2.0.0",
	"botocore-stubs>=1.38.46,<2.0.0",
	"pylint>=3.3.1,<4.0.0",
	"flake8>=7.1.1,<8.0.0",
	"black>=25.1.0,<26.0.0",
	"isort>=6.0.1,<7.0.0",
	"pytest-env>=1.1.5,<2.0.0",
	"types-requests>=2.32.0.20241016,<3.0.0",
	"ruff>=0.15.8",
]

[tool.black]
skip-string-normalization = true

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
