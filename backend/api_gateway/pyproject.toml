[project]
name = "api_gateway"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [ { name = "FelipeKha", email = "felipe.kharaba@icloud.com" } ]
requires-python = ">=3.14"
dependencies = [
	"pyhumps>=3.8.0",
	"uvicorn>=0.23.2",
	"python-multipart>=0.0.31",
	"boto3>=1.34.56",
	"numpy>=2.1.1",
	"openpyxl>=3.1.5",
	"fastapi>=0.115.6",
	"pydantic-settings>=2.14.2",
	"pyjwt[crypto]>=2.13.0",
	"slowapi>=0.1.9",
	"shared",
	"cerbos>=0.15.1",
	"pydantic>=2.12.5",
	"email-validator>=2.3.0",
	"cryptography>=48.0.1",
	"fastmcp>=3.4.3",
	"litellm>=1.55.0",
]

[dependency-groups]
dev = [
	"pytest>=8.2.2",
	"mypy>=1.3.0",
	"types-openpyxl>=3.1.5.20241025",
	"pytest-asyncio>=1.0.0",
	"boto3-stubs[cognito-idp,s3,ssm]>=1.39.4",
	"botocore-stubs>=1.38.46",
	"pytest-env>=1.1.5",
	"types-requests>=2.32.0.20241016",
	"ruff>=0.15.8",
	"pip-audit>=2.8.0",
	"bandit>=1.8.0",
	# "semgrep>=1.168.0",
]

[tool.uv]
package = true

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py314"
lint.extend-select = ["I"]
# lint.select = ["E", "F", "I", "N", "UP", "PL"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["api_gateway", "shared"]
combine_as_imports = true
multi_line_output = 3

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
