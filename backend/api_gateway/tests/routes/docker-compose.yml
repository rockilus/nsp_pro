services:
  mongodb-api-tests:
    image: mongo:5.0
    container_name: mongodb-api-tests
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: testpass
    ports:
      - "27019:27017"
    volumes:
      - mongo-api-data:/data/db

  cerbos-api-tests:
    build:
      context: ../../../../cerbos-policies
    container_name: cerbos-api-tests
    ports:
      - "3594:3592"  # gRPC (avoids conflict with dev stack on 3592)
      - "3595:3593"  # HTTP healthcheck / playground
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3593/_cerbos/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-api-data:
