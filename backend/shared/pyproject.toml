[project]
name = "shared"
version = "0.1.403"
description = ""
readme = "README.md"
authors = [ { name = "Felipe Kharaba" } ]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.2,<0.8.0",
    "mongo-types>=0.15.1,<0.16.0",
    "mypy>=1.13.0,<2.0.0",
    "flake8>=7.1.1,<8.0.0",
    "autoflake>=2.3.1,<3.0.0",
    "fastapi>=0.115.6,<0.116.0",
    "pylint>=3.3.2,<4.0.0",
    "black>=25.1.0,<26.0.0",
    "pytest>=8.3.5,<9.0.0",
    "dotenv>=0.9.9,<1.0.0",
    "isort>=6.0.1,<7.0.0",
    "pymongo[aws]>=4.11.3,<5.0.0",
    "pyhumps>=3.8.0,<4.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "boto3>=1.35.0,<2.0.0",
    "botocore>=1.35.0,<2.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["shared*"]

[tool.setuptools.package-data]
"shared" = ["py.typed"]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
