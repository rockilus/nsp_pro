[project]
name = "solve_service"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [ { name = "Felipe Kharaba" } ]
requires-python = ">=3.13,<=3.14"
dependencies = [
	"pydantic>=2.10.6,<3.0.0",
	"shared",
	"boto3>=1.37.10,<2.0.0",
	"pydantic-settings>=2.8.1,<3.0.0",
	"ortools==9.14.6206",
	"pandas>=2.2.3,<3.0.0",
	"xlsxwriter>=3.2.2,<4.0.0",
]

[dependency-groups]
dev = [
	"mypy>=1.15.0,<2.0.0",
	"pytest>=8.3.5,<9.0.0",
	"ipykernel>=6.29.5,<7.0.0",
	"pandas-stubs>=2.2.3.250308,<3.0.0",
	"boto3-stubs[s3,ssm]>=1.39.4,<2.0.0",
	"botocore-stubs>=1.38.46,<2.0.0",
	"ruff>=0.15.8",
]

[tool.uv]
# Optimization: Ensures local source is discoverable without setuptools mapping
package = true

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[build-system]
# Standardized modern PEP 517 build backend for uv
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"
# lint.select = ["E", "F", "I", "N", "UP", "PL"]

[tool.mypy]
# Global settings for this service
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Target the specific engine directory where ortools lives
module = "engine.*"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true