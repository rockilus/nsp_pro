[project]
name = "solve_service"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [ { name = "Felipe Kharaba" } ]
requires-python = ">=3.14"
dependencies = [
	"click>=8.3.3",
	"pydantic>=2.10.6",
	"shared",
	"boto3>=1.37.10",
	"pydantic-settings>=2.14.2",
	"ortools>=9.14.6206",
	"pandas>=2.2.3",
	"xlsxwriter>=3.2.2",
	"tornado>=6.5.7",
]

[dependency-groups]
dev = [
	"mypy>=1.15.0",
	"pytest>=8.3.5",
	"ipykernel>=6.29.5",
	"pandas-stubs>=2.2.3.250308",
	"boto3-stubs[s3,ssm]>=1.39.4",
	"botocore-stubs>=1.38.46",
	"ruff>=0.15.8",
	"pip-audit>=2.8.0",
	"bandit>=1.8.0",
	"semgrep>=1.119.0",
]

[tool.uv]
# Optimization: Ensures local source is discoverable without setuptools mapping
package = true

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[build-system]
# Standardized modern PEP 517 build backend for uv
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py314"
lint.extend-select = ["I"]
# lint.select = ["E", "F", "I", "N", "UP", "PL"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["solve_service", "shared"]
combine_as_imports = true
multi_line_output = 3

[tool.mypy]
# Global settings for this service
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Target the specific engine directory where ortools lives
module = "engine.*"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "ortools.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
	"unit: mark a test as a unit test",
]