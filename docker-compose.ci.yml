services:
  # General overrides for all services
  mongodb:
    # No ports needed for CI, services communicate via the Docker network
    ports: []
    # No persistent data in CI. This is crucial for clean runs.
    volumes: []

  localstack:
    # No ports needed
    ports: []
    environment:
      - SERVICES=sqs
      - DEBUG=1

  # LocalStack SQS Queue Initializer for CI
  localstack-init:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating SQS queues in LocalStack..."
        
        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name nsp-pro-dev-solve-dlq \
          --attributes MessageRetentionPeriod=1209600 || true
        
        SOLVE_DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes \
          --queue-url http://localstack:4566/000000000000/nsp-pro-dev-solve-dlq \
          --attribute-names QueueArn --query 'Attributes.QueueArn' --output text)
        
        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name nsp-pro-dev-solve-queue \
          --attributes "VisibilityTimeout=900,MessageRetentionPeriod=1209600,ReceiveMessageWaitTimeSeconds=20,RedrivePolicy={\\\"deadLetterTargetArn\\\":\\\"$$SOLVE_DLQ_ARN\\\",\\\"maxReceiveCount\\\":3}" || true
        
        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name nsp-pro-dev-email-dlq \
          --attributes MessageRetentionPeriod=1209600 || true
        
        EMAIL_DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes \
          --queue-url http://localstack:4566/000000000000/nsp-pro-dev-email-dlq \
          --attribute-names QueueArn --query 'Attributes.QueueArn' --output text)
        
        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name nsp-pro-dev-email-queue \
          --attributes "VisibilityTimeout=300,MessageRetentionPeriod=1209600,ReceiveMessageWaitTimeSeconds=20,RedrivePolicy={\\\"deadLetterTargetArn\\\":\\\"$$EMAIL_DLQ_ARN\\\",\\\"maxReceiveCount\\\":3}" || true
        
        echo "✅ SQS queues created"
        aws --endpoint-url=http://localstack:4566 sqs list-queues

  permit:
    # No ports needed
    ports: []
    # env_file: null
    # Use GitHub Secrets for API keys
    environment:
      - PDP_API_KEY=${PDP_API_KEY}
      - PDP_DEBUG=True # You might want this for debugging CI failures

  fastapi:
    # No ports needed; Playwright will access via a proxy service or the host network
    # The host network approach is simpler for Playwright
    ports:
      - "4000:4000" # Keep the port for Playwright access from the host

    depends_on:
      - localstack-init

    # Environment variables should be injected from GitHub Actions
    # env_file: null
    environment:
      # Environment
      - ENVIRONMENT=development

      # API Configuration
      - API_DOMAIN=0.0.0.0
      - API_URL=http://localhost:4000
      - API_PORT=4000
      - ORIGINS=["http://localhost:3000"]
      - CLIENT_URL=http://localhost:3000
      # Database Configuration - MongoDB for development
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE_NAME=test
      # Authorization - Permit
      - PDP_URL=http://permit:7000
      - PDP_API_KEY=${PDP_API_KEY}
      - AUTHZ_ENABLE_RETRY=True
      - AUTHZ_MAX_RETRIES=8
      - AUTHZ_INITIAL_DELAY=0.5
      # Development settings
      - UVICORN_RELOAD=True
      - TASK_EXPIRATION=150

      # Localstack Configuration
      - AWS_REGION=eu-west-3
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - ENDPOINT_URL=http://localstack:4566

      # SQS Configuration - Queue URLs
      - AWS_SQS_SOLVE_QUEUE_URL=http://localstack:4566/000000000000/nsp-pro-dev-solve-queue
      - AWS_SQS_EMAIL_QUEUE_URL=http://localstack:4566/000000000000/nsp-pro-dev-email-queue

      # Development Authentication Configuration
      - DEV_USER_ID=64e9b7f1e13e4a1a9c8b4567
      - DEV_USER_EMAIL=testuser@example.com
      - DEV_API_KEY=${DEV_API_KEY} 


  solve-service:
    depends_on:
      - localstack-init
    # env_file: null
    environment:
      # Environment
      - ENVIRONMENT=development

      # MongoDB Configuration (Development)
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE_NAME=test

      # AWS configuration (for local development)
      - AWS_REGION=eu-west-3
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_SESSION_TOKEN=
      - ENDPOINT_URL=http://localstack:4566

      # SQS Configuration - Queue URLs
      - AWS_SQS_SOLVE_QUEUE_URL=http://localstack:4566/000000000000/nsp-pro-dev-solve-queue
      - SQS_VISIBILITY_TIMEOUT=300

  frontend:
    # Use the production build command
    build:
      context: ./frontend
      args:
        # Environment
        - NEXT_PUBLIC_NODE_ENV=development

        # API Configuration  
        - NEXT_PUBLIC_API_URL=http://localhost:4000

        # Development Authentication - must match backend DEV_USER_ID
        - NEXT_PUBLIC_DEV_USER_ID=64e9b7f1e13e4a1a9c8b4567 # Test user
        - NEXT_PUBLIC_DEV_API_KEY=${DEV_API_KEY}

        # Production Cognito Config (not used in development but kept for compatibility)
        - NEXT_PUBLIC_COGNITO_AUTHORITY=https://placeholder-cognito-authority
        - NEXT_PUBLIC_COGNITO_CLIENT_ID=placeholder-client-id
        - NEXT_PUBLIC_REDIRECT_URI=http://localhost:3000/fr/callback/
        - NEXT_PUBLIC_LOGOUT_REDIRECT_URI=http://localhost:3000
      # Use the Dockerfile that builds the production version.
      # If your main Dockerfile does this, no change is needed here.
    # No ports needed; Playwright will access via a proxy service or the host network
    ports:
      - "3000:80" # Keep the port for Playwright access from the host
