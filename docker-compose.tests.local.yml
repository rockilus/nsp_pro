services:
  # MongoDB Database
  mongodb:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      # - mongodb_data:/data/db
      - /data/db
      # - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    healthcheck:
      test: mongo --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack (to emulate SQS)
  localstack:
    image: localstack/localstack:3.4
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEBUG=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack SQS Queue Initializer
  localstack-init:
    image: amazon/aws-cli:latest
    container_name: localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-3
      - LOCALSTACK_ENDPOINT=http://localstack:4566
    volumes:
      - ./scripts/init-localstack-sqs.sh:/init-localstack-sqs.sh:ro
    entrypoint: ["/bin/bash", "/init-localstack-sqs.sh"]

  # cognito-local — offline Cognito emulator for E2E auth tests
  cognito-local:
    image: jagregory/cognito-local:latest
    container_name: cognito-local
    ports:
      - "9229:9229"
    environment:
      - PORT=9229
      - CODE=123456          # fixed confirmation code for deterministic tests
    volumes:
      - ./cognito-local-data/.cognito:/app/.cognito
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9229',function(r){process.exit(0)}).on('error',function(){process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  # Cognito Local Initializer
  cognito-local-init:
    image: amazon/aws-cli:latest
    container_name: cognito-local-init
    depends_on:
      cognito-local:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-3
      - COGNITO_ENDPOINT=http://cognito-local:9229
    volumes:
      - ./scripts/init-cognito-local.sh:/init-cognito-local.sh:ro
    entrypoint: ["/bin/bash", "/init-cognito-local.sh"]

  # Cerbos AuthZ
  cerbos:
    build:
      context: ./cerbos-policies
      dockerfile: Dockerfile
    container_name: cerbos
    ports:
      - "3592:3592"  # gRPC
      - "3593:3593"  # HTTP / playground
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://cerbos:3593/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
