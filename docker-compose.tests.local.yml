services:
  # MongoDB Database
  mongodb:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      # - mongodb_data:/data/db
      - /data/db
      # - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    healthcheck:
      test: mongo --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack (to emulate SQS)
  localstack:
    image: localstack/localstack:3.4
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEBUG=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack SQS Queue Initializer
  localstack-init:
    image: amazon/aws-cli:latest
    container_name: localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-3
      - LOCALSTACK_ENDPOINT=http://localstack:4566
    volumes:
      - ./scripts/init-localstack-sqs.sh:/init-localstack-sqs.sh:ro
    entrypoint: ["/bin/bash", "/init-localstack-sqs.sh"]

  # Cerbos AuthZ
  cerbos:
    build:
      context: ./cerbos-policies
      dockerfile: Dockerfile
    container_name: cerbos
    ports:
      - "3592:3592"  # gRPC
      - "3593:3593"  # HTTP / playground
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://cerbos:3593/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
