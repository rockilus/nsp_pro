---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: team
  rules:
    # Any team member (leader or member) can read team details and user list
    - actions: ["read-team", "read-team-users", "read-own-worker"]
      effect: EFFECT_ALLOW
      roles:
        - leader
        - member

    # Only team leaders can update team settings or manage members
    - actions: ["update-team", "remove-user"]
      effect: EFFECT_ALLOW
      roles:
        - leader

    # Only team leaders can manage workers
    - actions: ["create-worker", "update-worker", "delete-worker"]
      effect: EFFECT_ALLOW
      roles:
        - leader

    # Any team member can read workers
    - actions: ["read-workers"]
      effect: EFFECT_ALLOW
      roles:
        - leader
        - member

    # Super admins can perform any action on any team resource
    - actions:
        - read-team
        - read-team-users
        - update-team
        - remove-user
        - read-own-worker
        - create-worker
        - read-workers
        - update-worker
        - delete-worker
      effect: EFFECT_ALLOW
      roles:
        - super_admin
