---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: team
  rules:
    # Any team member (leader or member): read access
    - actions:
        - read-team
        - read-team-users
        - read-own-worker
        - read-workers       # workers list
        - read-dimensions
        - read-shifts
        - read-link-shifts
        - create-request
        - read-requests
        - update-request
        - delete-request
      effect: EFFECT_ALLOW
      roles:
        - leader
        - member


    # Team leaders only: team management + worker management + dimension management
    - actions:
        - approve-request
        - deny-request
        - update-team        # team settings
        - remove-user        # member management
        - create-worker      # worker management
        - update-worker
        - delete-worker
        - create-dimension
        - update-dimension
        - delete-dimension
        - create-dim-entry
        - update-dim-entry
        - delete-dim-entry
        - update-attribute
        - create-shift
        - update-shift
        - delete-shift
        - create-link-shift
        - update-link-shift
        - delete-link-shift
        - create-shift-demand
        - read-shift-demands
        - update-shift-demand
        - delete-shift-demand
        - create-constraint
        - read-constraints
        - update-constraint
        - delete-constraint
        - read-constraint-templates
        - approve-request
        - deny-request
        - rescind-request
      effect: EFFECT_ALLOW
      roles:
        - leader

    # Super admins: full access to all team actions
    - actions:
        - read-team
        - read-team-users
        - read-own-worker
        - read-workers
        - read-dimensions
        - create-request
        - read-requests
        - update-request
        - approve-request
        - deny-request
        - rescind-request
        - delete-request
        - update-team
        - remove-user
        - create-worker
        - update-worker
        - delete-worker
        - create-dimension
        - update-dimension
        - delete-dimension
        - create-dim-entry
        - update-dim-entry
        - delete-dim-entry
        - update-attribute
        - read-shifts
        - create-shift
        - update-shift
        - delete-shift
        - create-link-shift
        - read-link-shifts
        - update-link-shift
        - delete-link-shift
        - read-shift-demands
        - create-shift-demand
        - update-shift-demand
        - delete-shift-demand
        - read-constraints
        - create-constraint
        - update-constraint
        - delete-constraint
        - read-constraint-templates
      effect: EFFECT_ALLOW
      roles:
        - super_admin
