name: Backend Checks
defaults:
  run:
    shell: bash
    working-directory: ./backend

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      # ── Shared (dep of api_gateway and solve_service) ──────
      - name: Install dependencies (shared)
        run: uv sync --locked --all-extras --dev
        working-directory: backend/shared

      # - name: "Security: pip-audit (shared)"
      #   run: uv run pip-audit
      #   working-directory: backend/shared

      - name: "Security: bandit (shared)"
        run: uv run bandit -r src/ -ll
        working-directory: backend/shared

      - name: "Security: semgrep (shared)"
        run: uv run semgrep --config=auto --error --quiet src/
        working-directory: backend/shared

      - name: Static checks (shared)
        run: |
          just typecheck && \
          just lint && \
          uv run ruff format --check .
        working-directory: backend/shared

      - name: Tests (shared)
        run: just test
        working-directory: backend/shared
        env:
          MONGO_URI: mongodb://testuser:testpass@localhost:27017/

      # ── API Gateway ─────────────────────────────────────────
      - name: Install dependencies (api_gateway)
        run: uv sync --locked --all-extras --dev
        working-directory: backend/api_gateway

      - name: "Security: pip-audit (api_gateway)"
        run: uv run pip-audit
        working-directory: backend/api_gateway

      - name: "Security: bandit (api_gateway)"
        run: uv run bandit -r src/ -ll
        working-directory: backend/api_gateway

      - name: "Security: semgrep (api_gateway)"
        run: uv run semgrep --config=auto --error --quiet src/
        working-directory: backend/api_gateway

      - name: Static checks (api_gateway)
        run: |
          just typecheck && \
          just lint && \
          uv run ruff format --check .
        working-directory: backend/api_gateway

      - name: Build and start Cerbos PDP for api_gateway tests
        run: |
          docker build -t cerbos-api-tests ${{ github.workspace }}/cerbos-policies/
          docker run -d \
            --name cerbos-api-tests \
            -p 3594:3592 \
            -p 3595:3593 \
            cerbos-api-tests

      - name: Wait for Cerbos PDP to be healthy
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3595/_cerbos/health && echo "Cerbos ready" && exit 0
            echo "Waiting for Cerbos... attempt $i"
            sleep 2
          done
          echo "Cerbos PDP did not become healthy in time" && exit 1

      - name: Tests (api_gateway)
        run: just test
        working-directory: backend/api_gateway
        env:
          MONGO_URI: mongodb://testuser:testpass@localhost:27017/

      # ── Solve Service (slowest — runs last) ────────────────
      - name: Install dependencies (solve_service)
        run: uv sync --locked --all-extras --dev
        working-directory: backend/solve_service

      - name: "Security: pip-audit (solve_service)"
        run: uv run pip-audit
        working-directory: backend/solve_service

      - name: "Security: bandit (solve_service)"
        run: uv run bandit -r src/ -ll
        working-directory: backend/solve_service

      - name: "Security: semgrep (solve_service)"
        run: uv run semgrep --config=auto --error --quiet src/
        working-directory: backend/solve_service

      - name: Static checks (solve_service)
        run: |
          just typecheck && \
          just lint && \
          uv run ruff format --check .
        working-directory: backend/solve_service

      - name: Tests (solve_service)
        run: just test
        working-directory: backend/solve_service
