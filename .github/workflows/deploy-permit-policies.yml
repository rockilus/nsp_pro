name: Deploy Permit.io Policies

on:
  push:
    branches: [main]
    paths: ['permit-policies/**']
  pull_request:
    branches: [main]
    paths: ['permit-policies/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
        - plan
        - apply

env:
  TF_VERSION: "1.5.0"

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: |
          cd permit-policies
          terraform fmt -check -recursive
        continue-on-error: true

      - name: Validate all environments
        run: |
          for env in development staging production; do
            echo "Validating $env environment..."
            cd permit-policies/environments/$env
            terraform init -backend=false
            terraform validate
            cd ../../..
          done

  plan:
    name: Plan Deployment
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        environment: 
          - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'development' }}
          - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
          - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure environment variables
        run: |
          echo "Environment: ${{ matrix.environment }}"
          case "${{ matrix.environment }}" in
            development)
              echo "PERMIT_ENVIRONMENT_ID=${{ secrets.PERMIT_ENVIRONMENT_ID_DEV }}" >> $GITHUB_ENV
              ;;
            staging)
              echo "PERMIT_ENVIRONMENT_ID=${{ secrets.PERMIT_ENVIRONMENT_ID_STAGING }}" >> $GITHUB_ENV
              ;;
            production)
              echo "PERMIT_ENVIRONMENT_ID=${{ secrets.PERMIT_ENVIRONMENT_ID_PROD }}" >> $GITHUB_ENV
              ;;
          esac

      - name: Terraform Init
        run: |
          cd permit-policies/environments/${{ matrix.environment }}
          terraform init

      - name: Terraform Plan
        run: |
          cd permit-policies/environments/${{ matrix.environment }}
          terraform plan \
            -var="permit_api_key=${{ secrets.PERMIT_API_KEY }}" \
            -var="permit_environment_id=${{ env.PERMIT_ENVIRONMENT_ID }}" \
            -out=tfplan

      - name: Save plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: permit-policies/environments/${{ matrix.environment }}/tfplan
          retention-days: 5

  deploy:
    name: Deploy to Environments
    runs-on: ubuntu-latest
    needs: [validate, plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        environment: [development, staging]
      fail-fast: false

    environment:
      name: ${{ matrix.environment }}
      url: https://app.permit.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure environment variables
        run: |
          case "${{ matrix.environment }}" in
            development)
              echo "PERMIT_ENVIRONMENT_ID=${{ secrets.PERMIT_ENVIRONMENT_ID_DEV }}" >> $GITHUB_ENV
              ;;
            staging)
              echo "PERMIT_ENVIRONMENT_ID=${{ secrets.PERMIT_ENVIRONMENT_ID_STAGING }}" >> $GITHUB_ENV
              ;;
          esac

      - name: Terraform Init
        run: |
          cd permit-policies/environments/${{ matrix.environment }}
          terraform init

      - name: Terraform Apply
        run: |
          cd permit-policies/environments/${{ matrix.environment }}
          terraform apply \
            -var="permit_api_key=${{ secrets.PERMIT_API_KEY }}" \
            -var="permit_environment_id=${{ env.PERMIT_ENVIRONMENT_ID }}" \
            -auto-approve

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: https://app.permit.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd permit-policies/environments/production
          terraform init

      - name: Terraform Apply
        run: |
          cd permit-policies/environments/production
          terraform apply \
            -var="permit_api_key=${{ secrets.PERMIT_API_KEY }}" \
            -var="permit_environment_id=${{ secrets.PERMIT_ENVIRONMENT_ID_PROD }}" \
            -auto-approve
