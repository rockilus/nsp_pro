name: Security Scans

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 3 * * *'  # nightly at 3 AM UTC

jobs:
  gitleaks:
    name: Gitleaks — secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        with:
          config-path: .gitleaks.toml

  trivy-fs:
    name: Trivy — filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  trivy-dockerfile:
    name: Trivy — Dockerfile config scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - backend/api_gateway/Dockerfile
          - backend/solve_service/Dockerfile
          - cerbos-policies/Dockerfile
          - frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ${{ matrix.path }}
          severity: HIGH,CRITICAL
          exit-code: 1

  hadolint:
    name: Hadolint — Dockerfile lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: |
            backend/api_gateway/Dockerfile
            backend/solve_service/Dockerfile
            cerbos-policies/Dockerfile
            frontend/Dockerfile

  shellcheck:
    name: ShellCheck — shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          find . -name '*.sh' -print0 | xargs -0 shellcheck -S error
