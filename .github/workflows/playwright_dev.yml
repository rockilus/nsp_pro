name: CI with Playwright

on:
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Playwright dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./frontend

      - name: Create required env files
        run: |
          touch .env.docker-compose.permit
          touch .env.docker-compose.fastapi
          touch .env.docker-compose.solve

      - name: Start all services with Docker Compose
        # This is where the magic happens.
        env:
          PDP_API_KEY: ${{ secrets.PDP_API_KEY }}
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
        run: |
          # The -f flag specifies multiple compose files.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build --detach
          
          # Wait for services to be healthy before running tests
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          # timeout 30s docker compose -f docker-compose.yml -f docker-compose.ci.yml wait fastapi frontend mongodb localstack permit
          # timeout 30s docker compose -f docker-compose.yml -f docker-compose.ci.yml wait mongodb
          # echo "MongoDB is healthy"
          # timeout 30s docker compose -f docker-compose.yml -f docker-compose.ci.yml wait permit
          # echo "Permit is healthy"
          # timeout 30s docker compose -f docker-compose.yml -f docker-compose.ci.yml wait localstack
          # echo "Localstack is healthy"
          # timeout 30s docker compose -f docker-compose.yml -f docker-compose.ci.yml wait fastapi
          # echo "FastAPI is healthy"
          # timeout 30s docker compose -f docker-compose.yml -f docker-compose.ci.yml wait frontend
          # echo "Frontend is healthy"

      - name: Wait for API health and create test team
        run: |
          set -euo pipefail
          echo "Waiting up to 30s for API /health..."
          max_retries=30
          count=0
          until [ $count -ge $max_retries ]; do
            echo "Attempt $((count+1))..."
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || true)
            if [ -n "$code" ] && [[ "$code" =~ ^2 ]]; then
              echo "API healthy (HTTP $code)."
              break
            fi
            count=$((count+1))
            sleep 1
          done
          if [ $count -ge $max_retries ]; then
            echo "API health check failed after ${max_retries}s"
            exit 1
          fi
          echo "Creating test user..."
          # Onboard user and capture body + status code
          resp_user=$(curl -s -w "\n%{http_code}" -X POST "http://localhost:4000/users/onboard" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "X-API-Key: $DEV_API_KEY" \
            -d '{"user_id":"64e9b7f1e13e4a1a9c8b4567","email":"testuser@example.com","username":"testuser","first_name":"Test","last_name":"User"}' || true)
          body_user=$(echo "$resp_user" | sed '$d')
          status_user=$(echo "$resp_user" | tail -n1)
          echo "Onboard response status: $status_user"
          echo "Onboard response body: $body_user"
          if [[ "$status_user" =~ ^2 ]]; then
            echo "User onboarded (status $status_user)."
          else
            echo "User onboarding failed with status $status_user. Exiting job."
            exit 1
          fi

          echo "Creating test team..."
          # POST and capture body + status code
          resp=$(curl -s -w "\n%{http_code}" -X POST "http://localhost:4000/teams" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "X-API-Key: $DEV_API_KEY" \
            -H "X-Dev-User-ID: 64e9b7f1e13e4a1a9c8b4567" \
            -d '{"team_name":"Worker Test Team from curl"}' || true)
          body=$(echo "$resp" | sed '$d')
          status=$(echo "$resp" | tail -n1)
          echo "Response status: $status"
          echo "Response body: $body"
          if [[ "$status" =~ ^2 ]]; then
            echo "Team created or request returned 2xx (status $status). Proceeding."
          else
            echo "Create team failed with status $status. Exiting job."
            exit 1
          fi
        working-directory: ./frontend
        env:
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
          TEST_API_URL: http://localhost:4000
          TEST_FRONTEND_URL: http://localhost:3000

      - name: Run Playwright tests
        run: npx playwright test
        # run: npx playwright test tests/e2e/shared/attribute/attribute-cell.spec.ts --grep "should save attribute value when pressing enter"
        working-directory: ./frontend
        env:
          # Environment
          TEST_ENVIRONMENT: development

          # Development Authentication (for local testing)
          TEST_USER_ID: 64e9b7f1e13e4a1a9c8b4567
          TEST_API_KEY: ${{ secrets.DEV_API_KEY }}

          # API and frontend URLs
          TEST_API_URL: http://localhost:4000
          TEST_FRONTEND_URL: http://localhost:3000
          # Permit.io PDP URL (if used)
          PERMIT_PDP_URL: http://localhost:7766

          # Test utilities configuration
          TEST_CONFIRMATION_TOKEN: test-reset-confirm
          TEST_DB_RESET_TIMEOUT_MS: 30000
          TEST_API_READY_TIMEOUT_MS: 10000
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        # if: ${{ !cancelled() }}
        if: always()
        with:
          name: playwright-report
          # path: playwright-report/
          path: ./frontend/playwright-report/
          retention-days: 30
        # if: always()
        # with:
        #   name: playwright-report
        #   path: ./frontend/playwright-report/

      - name: Teardown Docker Compose services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down