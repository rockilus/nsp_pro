services:
  # MongoDB Database
  mongodb:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      # - mongodb_data:/data/db
      - /data/db
      # - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    healthcheck:
      test: mongo --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack (to emulate SQS)
  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
    # environment:
    #   - SERVICES=sqs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localstack:4566/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Permit.io PDP
  permit:
    image: permitio/pdp-v2:latest
    container_name: permit
    ports:
      - "7766:7000"
    env_file:
      - .env.docker-compose.permit
    # environment:
    #   - PDP_API_KEY=your_api_key_here # Replace with your actual API key
    #   - PDP_DEBUG=True
    healthcheck:
      test: ["CMD", "curl", "-f", "http://permit:7766/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  fastapi:
    build:
      context: ./backend
      dockerfile: api_gateway/Dockerfile
    container_name: fastapi
    ports:
      - "4000:4000"
    env_file:
      - .env.docker-compose.fastapi
    # environment:
    #   # Use the service names as hostnames within the Docker network
    #   - MONGO_URI=mongodb://mongodb:27017
    #   - SQS_QUEUE_URL=http://localstack:4566/000000000000/my-solve-queue
    depends_on:
      - mongodb
      - localstack
      - permit
    # Add a health check to ensure it's ready before tests run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://fastapi:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Solve Service
  solve-service:
    build:
      context: ./backend
      dockerfile: solve_service/Dockerfile
    container_name: solve-service
    env_file:
      - .env.docker-compose.solve
    depends_on:
      - mongodb
      - localstack
    # Note: This service might need to wait for the SQS queue to be created.
    # You might need a startup script to create the queue on localstack.

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      args:
        # Environment
        - NEXT_PUBLIC_NODE_ENV=development

        # API Configuration  
        - NEXT_PUBLIC_API_URL=http://localhost:4000

        # Development Authentication - must match backend DEV_USER_ID
        - NEXT_PUBLIC_DEV_USER_ID=64e9b7f1e13e4a1a9c8b4567 # Test user
        - NEXT_PUBLIC_DEV_API_KEY=ffb1f25b3585109374ac5fefa1728247ce600a27569c8344d779a57e0186cc93

        # Production Cognito Config (not used in development but kept for compatibility)
        - NEXT_PUBLIC_COGNITO_AUTHORITY=https://placeholder-cognito-authority
        - NEXT_PUBLIC_COGNITO_CLIENT_ID=placeholder-client-id
        - NEXT_PUBLIC_REDIRECT_URI=http://localhost:3000/fr/plan/workers
        - NEXT_PUBLIC_LOGOUT_REDIRECT_URI=http://localhost:3000
    container_name: frontend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://frontend:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development user initialization
  # init-dev-user:
